[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-qa-sft"
version = "0.1.0"
description = "A compact legal-domain LoRA SFT project"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LLM-Guide"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
