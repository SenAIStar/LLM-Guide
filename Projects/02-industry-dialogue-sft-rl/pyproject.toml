[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-dialogue-sft-rl"
version = "0.1.0"
description = "Key SFT, reward modeling, and GRPO steps for an industry dialogue assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LLM-Guide"}]
dependencies = ["pyarrow", "torch", "transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
