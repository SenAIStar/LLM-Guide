[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-rag-sft"
version = "0.1.0"
description = "Core retrieval, grounded generation, SFT, and evaluation steps for enterprise RAG"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LLM-Guide"}]
dependencies = [
  "faiss-cpu",
  "FlagEmbedding",
  "numpy",
  "rank-bm25",
  "torch",
  "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
